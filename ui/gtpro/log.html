<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GT Pro Beta 0 — Log</title>
  <!-- reuse the console theme so .log-line / .log-divider / .ts + colour vars match -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    /* this page fills its OWN native window, so the log just fills the viewport */
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #141414;
      color: var(--text, #f0f0f0);
      font-family: var(--sans, "Kanit", system-ui, "Segoe UI", sans-serif);
    }
    .lw-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 10px 16px;
      background: linear-gradient(180deg, rgba(251, 149, 20, 0.1), rgba(251, 149, 20, 0.02));
      border-bottom: 1px solid var(--line, #3a2c1a);
    }
    .lw-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 700 13px var(--sans, system-ui, sans-serif);
      letter-spacing: 0.2px;
      color: var(--text, #f4e9d9);
    }
    .lw-title svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--amber-bright, #ffc53d);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .lw-status {
      margin-left: 4px;
      font: 600 10.5px var(--sans, system-ui, sans-serif);
      letter-spacing: 0.4px;
      color: var(--faint, #8a7a63);
    }
    .lw-status.on { color: var(--amber-bright, #ffc53d); }
    .lw-btn {
      font: 600 12px var(--sans, system-ui, sans-serif);
      color: var(--muted, #b9a489);
      background: transparent;
      border: 1px solid var(--line, #3a2c1a);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .lw-btn:hover {
      background: rgba(251, 149, 20, 0.12);
      color: var(--amber-bright, #ffc53d);
      border-color: var(--amber, #fb9514);
    }
    .lw-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: var(--mono, ui-monospace, "Cascadia Code", monospace);
      font-size: 12.5px;
      line-height: 1.7;
      background: #0e0a05;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="lw-head">
    <span class="lw-title">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
        <path d="M14 2v6h6" />
        <path d="M8 13h8M8 17h5" />
      </svg>
      Log
      <span class="lw-status" id="lwStatus">offline</span>
    </span>
    <button type="button" class="lw-btn" id="lwClear">Clear</button>
  </div>
  <div class="lw-body" id="lwBody" aria-live="polite"></div>

  <script>
    // Standalone activity-log window. Opens its OWN /ws/ui connection; the hub
    // broadcasts every "log" message to all UI clients, so this stays live in
    // parallel with the main panel. It only renders logs — all other message
    // types are ignored. Logs accumulate from the moment this window opens.
    (function () {
      var body = document.getElementById("lwBody");
      var statusEl = document.getElementById("lwStatus");
      document.getElementById("lwClear").addEventListener("click", function () {
        body.innerHTML = "";
      });

      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function addLine(message, level, tsMs) {
        if (level === "divider") {
          body.insertAdjacentHTML(
            "beforeend",
            '<div class="log-divider" role="separator" aria-hidden="true"></div>'
          );
        } else {
          // prefer the server's timestamp (epoch ms) so replayed backlog shows the
          // ORIGINAL time, not the reconnect time; fall back to now if absent.
          var ts = (tsMs ? new Date(tsMs) : new Date()).toLocaleTimeString();
          var cls = level === "warn" ? "warn" : level === "error" ? "error" : "";
          body.insertAdjacentHTML(
            "beforeend",
            '<div class="log-line ' + cls + '"><span class="ts">' + ts + "</span>" +
              escapeHtml(message) + "</div>"
          );
        }
        body.scrollTop = body.scrollHeight;
      }
      function setStatus(on) {
        statusEl.textContent = on ? "● live" : "offline";
        statusEl.classList.toggle("on", !!on);
      }

      var retry = 1000;
      function connect() {
        var proto = location.protocol === "https:" ? "wss" : "ws";
        var socket = new WebSocket(proto + "://" + location.host + "/ws/ui");
        socket.addEventListener("open", function () {
          setStatus(true);
          retry = 1000;
        });
        socket.addEventListener("message", function (ev) {
          var msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            return;
          }
          if (msg && msg.type === "log" && msg.data)
            addLine(msg.data.message, msg.data.level, msg.data.ts);
        });
        socket.addEventListener("close", function () {
          setStatus(false);
          setTimeout(connect, retry);
          retry = Math.min(retry * 1.5, 8000); // backoff, capped
        });
        socket.addEventListener("error", function () {
          try {
            socket.close();
          } catch (e) {
            /* close triggers the retry above */
          }
        });
      }
      connect();
    })();
  </script>
</body>
</html>
